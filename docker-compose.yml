services:
  postgres:
    image: postgres:16-alpine
    container_name: api-sandbox-postgres-1
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-api_sandbox}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-api_sandbox}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: api-sandbox-redis-1
    ports:
      - "6379:6379"
    networks:
      - traefik-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:latest
    container_name: api-sandbox-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Enable dashboard ONLY if explicitly requested
      - "--api.insecure=${TRAEFIK_DASHBOARD:-false}"
      # Enable ACME (Let's Encrypt)
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      # Dashboard port (only accessible if TRAEFIK_DASHBOARD=true)
      - "8081:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_certs:/letsencrypt"
    networks:
      - traefik-net

  backend:
    build: ./backend
    container_name: api-sandbox-backend
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-api_sandbox}?sslmode=disable}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - HOST_WORKSPACES_DIR=${HOST_WORKSPACES_DIR}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_WORKSPACES_DIR}:/app/workspaces
    networks:
      - traefik-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN:-localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.backend.tls=${ENABLE_TLS:-false}"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    container_name: api-sandbox-frontend
    environment:
      - BACKEND_URL=http://backend:8080
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.frontend.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.routers.frontend.tls=${ENABLE_TLS:-false}"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

networks:
  traefik-net:
    name: traefik-net
    driver: bridge

volumes:
  postgres_data:
  traefik_certs:
