name: CI

on:
  push:
    branches: [main, tier]
  pull_request:
    branches: [main, tier]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Backend Tests
        run: |
          cd backend
          go test ./...
          go vet ./...
